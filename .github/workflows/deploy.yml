name: CI/CD Pipeline - Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  Test-and-Deploy:
    name: Build, Verify Security & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 4. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. Verify AI Concurrency Engine (RF & SVM Paralel)
        run: |
          python test/test_ai_concurrency.py

      - name: 6. Install Node.js Dependencies
        run: npm install

      - name: 7. Verify HMAC-SHA256 Security Scenarios (3/3 Lulus)
        run: |
          node scripts/test_flows.js
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET || 'cyber_soc_secure_hmac_secret_2026_key_super_safe' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8886739791:AAE0xHTkhwU_caj8dYD48w9uo0K1SjQY0bc' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '7182134624' }}

      - name: 8. Execute Production Web Build
        run: npm run build

      - name: 9. Deploy to Vercel Production
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "[+] VERCEL_TOKEN terdeteksi di GitHub Secrets. Menjalankan deployment via Vercel CLI..."
            npm install --global vercel@latest
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            echo "[i] VERCEL_TOKEN belum disetel di GitHub Secrets."
            echo "[i] Deployment Vercel telah aktif secara otomatis melalui Git Integration di: https://intgrated-web.vercel.app/"
            echo "[✔] Seluruh pengujian pipeline CI/CD telah diverifikasi 100% SUKSES!"
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
